<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testar controle</title>
<style>
body{margin:0;background:#070a12;color:#eaf2ff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
h1{font-size:44px;margin:0 0 8px}p{color:#9fb2d0;font-size:22px;margin:4px}
#k{font-size:96px;font-weight:800;margin:28px;min-height:120px;color:#6cc6ff}
.g{display:grid;grid-template-columns:repeat(6,150px);gap:12px;margin-top:10px}
.b{background:#141b2b;border:2px solid #263450;border-radius:14px;padding:14px;text-align:center;font-size:20px}
.on{background:#6cc6ff;color:#06121f;border-color:#fff}
#api{margin-top:18px;font-size:18px;color:#7e8aa2}
</style></head><body>
<h1>Testar controle</h1>
<p>Aperte os botões e mexa os analógicos. A tecla que o jogo recebe aparece abaixo.</p>
<div id="k">—</div>
<div class="g" id="g"></div>
<div id="api"></div>
<p>Voltar 2 vezes sai</p>
<script>
var names={" ":"A · Espaço (pular)",Control:"B/R2 · Ctrl (atirar)",e:"X · E (usar)",r:"Y · R (recarregar)",q:"L1 · Q",f:"R1 · F",Shift:"L2 · Shift (correr)",Enter:"Start/OK · Enter",Escape:"Select · Esc",w:"Analógico ↑ · W",a:"Analógico ← · A",s:"Analógico ↓ · S",d:"Analógico → · D",ArrowUp:"↑",ArrowDown:"↓",ArrowLeft:"← virar",ArrowRight:"→ virar",PageUp:"Olhar p/ cima",PageDown:"Olhar p/ baixo",v:"R3 · V"};
var g=document.getElementById('g'),box={};
Object.keys(names).forEach(function(k){var d=document.createElement('div');d.className='b';d.textContent=names[k];g.appendChild(d);box[k.toLowerCase()]=d;});
function key(e,on){var k=e.key.length==1?e.key.toLowerCase():e.key;var d=box[k.toLowerCase()];if(d)d.className=on?'b on':'b';if(on){document.getElementById('k').textContent=names[k]||e.key;console.log('TECLA '+e.key);}e.preventDefault();}
addEventListener('keydown',function(e){key(e,true)});addEventListener('keyup',function(e){key(e,false)});
var api=('getGamepads' in navigator);document.getElementById('api').textContent='Gamepad API do navegador: '+(api?'disponível':'não disponível (o app converte o controle em teclado)');
console.log('GAMEPAD_API='+(api?'sim':'nao'));
</script></body></html>
