name: Teste de abertura (emulador)

on:
  push:
    branches: [ main, 'teste-*' ]
    paths-ignore: [ 'home/**', '.github/workflows/home.yml' ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compilar
        run: gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Mostrar erros de compilacao
        if: failure()
        run: |
          E=$(grep -E "^e: |error:|FAILED|What went wrong" -A2 build.log | head -30 | cut -c1-300 | tr '\n' '|' | cut -c1-3800)
          echo "::error title=Erro de compilacao::$E"
      - name: Abrir o app no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -no-snapshot -camera-back none -memory 3072
          script: |
            adb install -r app/build/outputs/apk/tv/debug/app-tv-debug.apk
            adb logcat -c
            adb shell monkey -p com.auroratv.tv -c android.intent.category.LAUNCHER 1
            sleep 30
            adb logcat -d > logcat.txt
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screen.png || true
            adb shell pidof com.auroratv.tv || echo "APP NAO ESTA RODANDO" > dead.txt
      - name: Teste de audio, retomada e fluidez
        if: always()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: false
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -no-snapshot -camera-back none -memory 3072
          script: |
            adb install -r app/build/outputs/apk/tv/debug/app-tv-debug.apk
            adb shell am force-stop com.auroratv.tv
            adb logcat -c
            adb shell am start -n com.auroratv.tv/.MainActivity --es aurora_ui tv --es aurora_test "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
            sleep 20
            adb shell dumpsys audio | grep -iE "AudioPlaybackConfiguration|state:started|usage=USAGE_MEDIA" | head -8 > audio.txt || true
            sleep 42
            adb logcat -d -s AuroraTest:I AuroraAI:I AuroraImg:I > test.txt || true
            adb shell input keyevent KEYCODE_BACK
            sleep 3
            adb shell dumpsys gfxinfo com.auroratv.tv reset > /dev/null
            for i in $(seq 1 12); do adb shell input keyevent KEYCODE_DPAD_RIGHT; done
            for i in $(seq 1 6); do adb shell input keyevent KEYCODE_DPAD_DOWN; done
            for i in $(seq 1 12); do adb shell input keyevent KEYCODE_DPAD_LEFT; done
            sleep 2
            adb shell dumpsys gfxinfo com.auroratv.tv | grep -E "Total frames|Janky frames|50th|90th|95th|99th" > gfx.txt || true
            # tela parada: sem ninguem mexer o app nao pode continuar desenhando (gasta GPU e esquenta a TV)
            sleep 62
            adb shell dumpsys gfxinfo com.auroratv.tv reset > /dev/null; sleep 8
            adb shell dumpsys gfxinfo com.auroratv.tv | grep -E "Total frames" > repouso.txt || true
            adb logcat -d | grep -E "ANR in com.auroratv|FATAL EXCEPTION|Process: com.auroratv" > travas.txt || true
            adb shell pidof com.auroratv.tv > vivo.txt || echo "morto" > vivo.txt
            adb install -r app/build/outputs/apk/celular/debug/app-celular-debug.apk; adb logcat -c; adb shell am start -n com.astrolume.celular/com.auroratv.tv.MainActivity; sleep 20; S=$(adb shell wm size | grep -oE "[0-9]+x[0-9]+" | tail -1); W=${S%x*}; H=${S#*x}; echo "tela $W x $H"; adb shell input tap $((W*31/100)) $((H*93/100)); sleep 4; adb shell dumpsys gfxinfo com.astrolume.celular reset > /dev/null; adb shell input swipe $((W/2)) $((H*75/100)) $((W/2)) $((H*25/100)) 400; sleep 1; adb shell input swipe $((W/2)) $((H*75/100)) $((W/2)) $((H*25/100)) 400; sleep 2; adb shell dumpsys gfxinfo com.astrolume.celular | grep -E "Total frames|Janky|50th|95th" | sed "s/^/celular /" >> gfx.txt || true; adb logcat -d | grep -E "Choreographer.*Skipped" | tail -5 | sed "s/^/celular /" >> gfx.txt || true
            adb logcat -d | grep -E "ANR in com.astrolume|FATAL EXCEPTION" >> travas.txt || true
            adb shell pidof com.astrolume.celular > /dev/null || echo "morto celular" >> vivo.txt
      - name: Resultado do teste
        if: always()
        run: |
          T=$(grep -E "t=(2|12) |SEEK|RETOMADA|RESUMO|FIM|fluidez|play.google" test.txt | sed 's/.*AuroraTest: //' | cut -c1-230 | tr '\n' '|' | cut -c1-3000)
          echo "::warning title=Teste::$T"
          A=$(cat audio.txt | cut -c1-200 | tr '\n' '|' | cut -c1-1500)
          echo "::warning title=Audio::$A"
          G=$(cat gfx.txt | tr '\n' '|')
          echo "::warning title=Fluidez::$G"
      - name: Portao de fluidez (bloqueia a publicacao se travar)
        if: always()
        run: |
          # travamento (ANR), fechamento inesperado ou app morto = reprova
          if [ -s travas.txt ]; then echo "::error title=Travamento::$(head -5 travas.txt | tr '\n' '|')"; exit 1; fi
          if grep -q morto vivo.txt; then echo "::error title=Travamento::o app fechou durante o teste"; exit 1; fi
          # tempo de quadro no emulador (sem placa de video): limites folgados, so pega regressao grave
          P50=$(grep -m1 "50th percentile" gfx.txt | grep -oE "[0-9]+ms" | head -1 | tr -d ms)
          P95=$(grep -m1 "95th percentile" gfx.txt | grep -oE "[0-9]+ms" | head -1 | tr -d ms)
          echo "mediana=${P50}ms p95=${P95}ms"
          if [ -n "$P50" ] && [ "$P50" -gt 34 ]; then echo "::error title=Fluidez::mediana ${P50}ms (limite 34ms)"; exit 1; fi
          if [ -n "$P95" ] && [ "$P95" -gt 150 ]; then echo "::error title=Fluidez::p95 ${P95}ms (limite 150ms)"; exit 1; fi
          RP=$(grep -m1 "Total frames" repouso.txt | grep -oE "[0-9]+$")
          echo "quadros com a tela parada (8s) = $RP"
          if [ -z "$RP" ]; then echo "::error title=Tela parada::nao deu para medir a tela parada"; exit 1; fi
          if [ "$RP" -gt 20 ]; then echo "::error title=Tela parada::o app desenhou $RP quadros sem ninguem mexer (limite 20): alguma animacao ficou rodando sozinha"; exit 1; fi
          # celular: so conta se houve quadros desenhados na rolagem
          CF=$(grep -m1 "celular Total frames" gfx.txt | grep -oE "[0-9]+$")
          C50=$(grep -m1 "celular 50th percentile" gfx.txt | grep -oE "[0-9]+ms" | head -1 | tr -d ms)
          if [ -n "$CF" ] && [ "$CF" -gt 5 ] && [ -n "$C50" ] && [ "$C50" -gt 34 ]; then echo "::error title=Fluidez celular::mediana ${C50}ms (limite 34ms)"; exit 1; fi
          echo "::notice title=Fluidez aprovada::mediana ${P50}ms, p95 ${P95}ms, tela parada ${RP:-nao medido} quadros, sem travamentos · celular: ${CF:-0} quadros, mediana ${C50:-?}ms"
      - name: Resumo do erro
        if: always()
        run: |
          ls -la logcat.txt || echo "sem logcat"
          L=$(grep -iE "auroratv|FATAL EXCEPTION|AndroidRuntime: [^S]|Caused by|ActivityManager.*(died|crash)|has died|Force finishing" logcat.txt | grep -v "BestClock" | head -40 | cut -c1-260 | tr '\n' '|' | cut -c1-3800)
          echo "::error title=Log::$L"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            logcat.txt
            screen.png
            test.txt
            gfx.txt
            audio.txt
