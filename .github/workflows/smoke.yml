name: Teste de abertura (emulador)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Abrir o app no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 3072
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell monkey -p com.auroratv.tv -c android.intent.category.LAUNCHER 1
            sleep 30
            adb logcat -d > logcat.txt
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screen.png || true
            adb shell pidof com.auroratv.tv || echo "APP NAO ESTA RODANDO" > dead.txt
      - name: Resumo do erro
        if: always()
        run: |
          ls -la logcat.txt || echo "sem logcat"
          L=$(grep -iE "auroratv|AndroidRuntime|FATAL|ActivityTaskManager|ActivityManager.*(died|crash)|Exception|monkey" logcat.txt | grep -v "Choreographer" | head -40 | cut -c1-260 | tr '\n' '|' | cut -c1-3800)
          echo "::error title=Log::$L"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            logcat.txt
            screen.png
