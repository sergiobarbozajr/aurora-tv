name: Build AuroraTV APK

# so publica depois que o teste no emulador (inclusive o portao de fluidez) passar
on:
  workflow_run:
    workflows: [ "Teste de abertura (emulador)" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar o APK (debug)
        run: gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Mostrar erros de compilacao
        if: failure()
        run: |
          E=$(grep -E "^e: |error:|FAILED|What went wrong" -A2 build.log | head -30 | cut -c1-300 | tr '\n' '|' | cut -c1-3800)
          echo "::error title=Erro de compilacao::$E"

      - name: Ler a versao do app
        id: ver
        run: |
          V=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Publicar o APK (baixavel no GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: AuroraTV-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Separar os dois aplicativos
        run: |
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk AstroLumeTV.apk
          cp app/build/outputs/apk/celular/debug/app-celular-debug.apk AstroLume-celular.apk

      - name: Publicar versao para a atualizacao dentro do app
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: AuroraTV ${{ steps.ver.outputs.name }}
          files: AstroLumeTV.apk

      - name: Publicar a versao para celular (separada da TV)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: celular-v${{ steps.ver.outputs.name }}
          name: AstroLume celular ${{ steps.ver.outputs.name }}
          prerelease: true
          files: AstroLume-celular.apk
