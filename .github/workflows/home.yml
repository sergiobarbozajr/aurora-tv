name: AstroLume Home (launcher)

# compila, testa no emulador (abertura, navegação, fluidez, travamentos) e só então publica
on:
  push:
    branches: [ main, 'teste-*' ]
    paths: [ 'home/**', '.github/workflows/home.yml', 'settings.gradle.kts' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compilar
        run: gradle :home:assembleDebug --no-daemon 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Mostrar erros de compilacao
        if: failure()
        run: |
          E=$(grep -E "^e: |error:|FAILED|What went wrong|Could not" -A2 build.log | head -40 | cut -c1-300 | tr '\n' '|' | cut -c1-3900)
          echo "::error title=Erro de compilacao::$E"
      - name: Testar no emulador (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -no-snapshot -camera-back none -no-audio -memory 3072
          script: |
            set +e
            mkdir -p cap
            echo "inicio $(adb get-state)" >> cap/passos.txt
            adb shell wm size 1280x720; adb shell wm density 213; sleep 2
            adb install -r home/build/outputs/apk/debug/home-debug.apk >> cap/passos.txt 2>&1
            adb shell cmd package set-home-activity com.astrolume.home/.HomeActivity || true
            adb logcat -c
            # grava o log sem parar: se o emulador morrer no meio, ainda sobra a prova do que aconteceu
            (adb logcat -v time > cap/logcat.txt 2>&1 &) ; sleep 1
            adb shell input keyevent KEYCODE_HOME; sleep 12
            echo "instalado $(adb get-state)" >> cap/passos.txt
            adb exec-out screencap -p > cap/1_repouso.png
            adb shell dumpsys gfxinfo com.astrolume.home reset > /dev/null
            for i in 1 2 3 4 5 6 7 8; do adb shell input keyevent KEYCODE_DPAD_RIGHT; done
            for i in 1 2 3 4 5 6 7 8; do adb shell input keyevent KEYCODE_DPAD_LEFT; done
            adb shell input keyevent KEYCODE_DPAD_RIGHT; adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1
            adb exec-out screencap -p > cap/2_foco_app.png
            echo "2_foco $(adb get-state)" >> cap/passos.txt
            adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1; adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 2
            adb exec-out screencap -p > cap/3_aberto.png
            echo "3_aberto $(adb get-state)" >> cap/passos.txt
            for i in 1 2 3 4; do adb shell input keyevent KEYCODE_DPAD_RIGHT; done
            adb shell input keyevent KEYCODE_DPAD_DOWN; adb shell input keyevent KEYCODE_DPAD_UP
            adb shell input keyevent KEYCODE_DPAD_LEFT; sleep 1
            adb shell input keyevent KEYCODE_DPAD_CENTER; sleep 2
            adb exec-out screencap -p > cap/4_menu.png
            echo "4_menu $(adb get-state)" >> cap/passos.txt
            adb shell input keyevent KEYCODE_DPAD_CENTER; sleep 1
            adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 2
            adb exec-out screencap -p > cap/5_tema_espacial.png
            echo "5_tema $(adb get-state)" >> cap/passos.txt
            for i in 1 2 3; do adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1; done; sleep 1
            adb exec-out screencap -p > cap/6_tema_imagem.png
            echo "6_tema_imagem $(adb get-state)" >> cap/passos.txt
            adb shell input keyevent KEYCODE_BACK; sleep 1
            adb shell input keyevent KEYCODE_DPAD_DOWN; adb shell input keyevent KEYCODE_DPAD_CENTER; sleep 2
            adb exec-out screencap -p > cap/7_organizar.png
            echo "7_organizar $(adb get-state)" >> cap/passos.txt
            adb shell input keyevent KEYCODE_DPAD_CENTER; adb shell input keyevent KEYCODE_DPAD_CENTER
            adb shell input keyevent KEYCODE_BACK; sleep 1
            adb shell input keyevent KEYCODE_DPAD_DOWN; adb shell input keyevent KEYCODE_DPAD_CENTER; sleep 7
            adb exec-out screencap -p > cap/8_desempenho.png
            echo "8_desempenho $(adb get-state)" >> cap/passos.txt
            adb shell input keyevent KEYCODE_BACK; adb shell input keyevent KEYCODE_BACK; sleep 1
            adb shell input keyevent KEYCODE_DPAD_LEFT; adb shell input keyevent KEYCODE_DPAD_CENTER; sleep 2
            adb exec-out screencap -p > cap/9_todos_apps.png
            echo "9_todos_apps $(adb get-state)" >> cap/passos.txt
            adb shell input keyevent KEYCODE_BACK; sleep 1
            adb shell input keyevent KEYCODE_HOME; sleep 2
            adb exec-out screencap -p > cap/10_inicio_depois.png
            echo "10_inicio $(adb get-state)" >> cap/passos.txt
            adb shell dumpsys gfxinfo com.astrolume.home | grep -E "Total frames|Janky frames|50th|90th|95th|99th" > gfx.txt || true
            # tela parada: sem ninguem mexer, o launcher nao pode continuar desenhando (gasta GPU e esquenta)
            adb shell input keyevent KEYCODE_HOME; sleep 4
            adb shell dumpsys gfxinfo com.astrolume.home reset > /dev/null; sleep 8
            adb shell dumpsys gfxinfo com.astrolume.home | grep -E "Total frames" > repouso.txt || true
            echo "medido $(adb get-state)" >> cap/passos.txt
            sleep 2
            grep -E "ANR in com.astrolume|FATAL EXCEPTION|Process: com.astrolume" cap/logcat.txt > travas.txt || true
            adb shell pidof com.astrolume.home > vivo.txt || echo "morto" > vivo.txt
            adb shell am start -n com.astrolume.home/.HomeActivity --es home_test "theme:1"; sleep 3
            adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 2
            adb exec-out screencap -p > cap/11_espacial_aberto.png
      - name: Portao de fluidez (bloqueia a publicacao se travar)
        if: always()
        run: |
          cat gfx.txt || true
          echo "::notice title=Ate onde foi::$(tr '\n' '|' < cap/passos.txt | tail -c 2000)"
          if [ ! -s gfx.txt ]; then echo "::error title=Teste interrompido::o emulador parou antes de medir; ultimo passo: $(grep -c . cap/passos.txt) marcas"; fi
          if [ -s travas.txt ]; then echo "::error title=Travamento::$(head -8 travas.txt | tr '\n' '|')"; grep -A12 "FATAL EXCEPTION" cap/logcat.txt | head -30 | tr '\n' '|' | cut -c1-3500 | sed 's/^/::error title=Erro::/'; exit 1; fi
          if grep -q morto vivo.txt; then echo "::error title=Travamento::o launcher fechou durante o teste"; exit 1; fi
          P50=$(grep -m1 "50th percentile" gfx.txt | grep -oE "[0-9]+ms" | head -1 | tr -d ms)
          P95=$(grep -m1 "95th percentile" gfx.txt | grep -oE "[0-9]+ms" | head -1 | tr -d ms)
          TF=$(grep -m1 "Total frames" gfx.txt | grep -oE "[0-9]+$")
          JK=$(grep -m1 "Janky frames" gfx.txt | sed 's/.*: //')
          echo "quadros=$TF mediana=${P50}ms p95=${P95}ms janky=$JK"
          if [ -z "$TF" ] || [ "$TF" -lt 20 ]; then echo "::error title=Fluidez::poucos quadros medidos ($TF)"; exit 1; fi
          if [ -n "$P50" ] && [ "$P50" -gt 34 ]; then echo "::error title=Fluidez::mediana ${P50}ms (limite 34ms)"; exit 1; fi
          if [ -n "$P95" ] && [ "$P95" -gt 150 ]; then echo "::error title=Fluidez::p95 ${P95}ms (limite 150ms)"; exit 1; fi
          RP=$(grep -m1 "Total frames" repouso.txt | grep -oE "[0-9]+$")
          echo "quadros com a tela parada (8s) = $RP"
          if [ -n "$RP" ] && [ "$RP" -gt 20 ]; then echo "::error title=Tela parada::o launcher desenhou $RP quadros sem ninguem mexer (limite 20): alguma animacao ficou rodando sozinha"; exit 1; fi
          echo "::notice title=Fluidez aprovada::$TF quadros, mediana ${P50}ms, p95 ${P95}ms, janky $JK, repouso $RP quadros, sem travamentos"
      - name: Log do launcher
        if: always()
        run: |
          L=$(grep -iE "astrolume|AndroidRuntime|Caused by" cap/logcat.txt | grep -v "BestClock" | head -30 | cut -c1-250 | tr '\n' '|' | cut -c1-3800)
          echo "::warning title=Log::$L"
      - name: Publicar capturas
        if: always()
        run: |
          cd cap || exit 0
          # guarda so o essencial do log, para caber na branch de capturas
          grep -iE "astrolume|AndroidRuntime|FATAL|ANR |Choreographer|lowmemory|died|Force" logcat.txt | tail -400 > log.txt 2>/dev/null || true
          rm -f logcat.txt
          cp ../gfx.txt ../repouso.txt . 2>/dev/null || true
          git init -q && git checkout -q -b capturas-home
          git config user.name "AstroLume CI" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "capturas $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" capturas-home
      - name: Ler a versao
        id: ver
        run: echo "name=$(grep -m1 'versionName' home/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"
      - name: Separar o APK
        run: cp home/build/outputs/apk/debug/home-debug.apk AstroLumeHome.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AstroLumeHome-apk
          path: AstroLumeHome.apk
      - name: Publicar a versao do launcher (separada do AstroLume TV)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: home-v${{ steps.ver.outputs.name }}
          name: AstroLume Home ${{ steps.ver.outputs.name }}
          prerelease: true
          files: AstroLumeHome.apk
